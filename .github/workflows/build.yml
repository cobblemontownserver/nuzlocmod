name: Build Type Wheel

on:
  push:
    branches: [typewheel]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Server boot test
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          gradle runServer --no-daemon --args="nogui" > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if grep -q 'Done (' server.log; then echo BOOT_OK; break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 5
          done
          kill $PID 2>/dev/null || true
          tail -60 server.log
          grep -q 'Done (' server.log
      - uses: actions/upload-artifact@v4
        with:
          name: typewheel
          path: build/libs/*.jar
      - name: Publish jar to the "typewheel-jar" branch
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          mkdir -p /tmp/out && cp "$JAR" /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan typewheel-jar
          git rm -rf --quiet . || true
          git clean -fdxq
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "Built jar from ${{ github.sha }}"
          git push -f origin typewheel-jar
